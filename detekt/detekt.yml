complexity:
  LongParameterList:
    allowedFunctionParameters: 7
  TooManyFunctions:
    ignorePrivate: true
    allowedFunctionsPerClass: 15

coroutines:
  InjectDispatcher:
    excludes: ['**/DispatcherProvider.kt']

exceptions:
  TooGenericExceptionCaught:
    excludes: ['**/ElmStore.kt']

style:
  AbstractClassCanBeConcreteClass:
    excludes: ['**/EmptyContentProvider.kt']
  AbstractClassCanBeInterface:
    excludes: ['**/commonTest/**', '**/samples/**']
  MaxLineLength:
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**']
