# ----- Gradle Options -----
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# https://docs.gradle.org/current/userguide/multi_project_builds.html#sec:parallel_execution
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# https://docs.gradle.org/current/userguide/gradle_daemon.html
org.gradle.daemon=true
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
#
# ----- AndroidX -----
#
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
#
# ----- Kotlin -----
#
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
#
#
# ----- Kotlin/Native features -----
#
kotlin.native.distribution.downloadFromMaven=true
# https://kotlinlang.org/docs/multiplatform-publish-lib.html
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
#
# ----- Config -----
#
libraryVersion=3.0.0
libraryGroup=money.vivid.elmslie
